services:
  - type: web
    name: coinmuseum
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VOLCENGINE_AK
        sync: false
      - key: VOLCENGINE_SK
        sync: false
